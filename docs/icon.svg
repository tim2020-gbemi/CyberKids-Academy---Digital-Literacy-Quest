<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="112" fill="url(#cyberBg)" />

  <!-- Shield Base -->
  <path d="M256 64 C352 64, 400 96, 400 192 C400 320, 320 400, 256 448 C192 400, 112 320, 112 192 C112 96, 160 64, 256 64 Z" fill="url(#shieldGrad)" stroke="#67e8f9" stroke-width="12" />

  <!-- Inner Shield Glow -->
  <path d="M256 96 C332 96, 370 120, 370 196 C370 300, 305 368, 256 410 C207 368, 142 300, 142 196 C142 120, 180 96, 256 96 Z" fill="#0f172a" opacity="0.45" />

  <!-- Glowing Golden Lightning Bolt -->
  <path d="M276 130 L186 270 L250 270 L236 382 L326 242 L262 242 Z" fill="url(#goldGrad)" filter="url(#glow)" />

  <!-- Top Star -->
  <polygon points="256,112 262,128 278,128 265,138 270,154 256,144 242,154 247,138 234,128 250,128" fill="#fef08a" />
</svg>
